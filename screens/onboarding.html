<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-tertiary-fixed": "#341100",
            "secondary-container": "#e2e0fc",
            "surface-container-highest": "#e1e3e4",
            "on-error-container": "#93000a",
            "surface-container": "#edeeef",
            "surface-bright": "#f8f9fa",
            "inverse-surface": "#2e3132",
            "secondary": "#5d5c74",
            "on-primary": "#ffffff",
            "on-secondary-container": "#63627a",
            "tertiary-fixed-dim": "#ffb691",
            "on-tertiary-container": "#0e0200",
            "on-secondary": "#ffffff",
            "on-surface-variant": "#414754",
            "on-secondary-fixed-variant": "#45455b",
            "inverse-primary": "#adc7ff",
            "surface": "#f8f9fa",
            "surface-container-high": "#e7e8e9",
            "on-background": "#191c1d",
            "on-secondary-fixed": "#1a1a2e",
            "surface-variant": "#e1e3e4",
            "on-primary-fixed": "#001a41",
            "on-tertiary-fixed-variant": "#783100",
            "on-primary-container": "#ffffff",
            "surface-tint": "#005bc0",
            "inverse-on-surface": "#f0f1f2",
            "tertiary-container": "#c55500",
            "outline": "#727785",
            "on-error": "#ffffff",
            "error-container": "#ffdad6",
            "tertiary": "#9e4300",
            "error": "#ba1a1a",
            "on-surface": "#191c1d",
            "tertiary-fixed": "#ffdbcb",
            "primary-container": "#1a73e8",
            "surface-container-low": "#f3f4f5",
            "primary-fixed-dim": "#adc7ff",
            "primary-fixed": "#d8e2ff",
            "surface-dim": "#d9dadb",
            "outline-variant": "#c1c6d6",
            "on-primary-fixed-variant": "#004493",
            "secondary-fixed-dim": "#c6c4df",
            "surface-container-lowest": "#ffffff",
            "background": "#f8f9fa",
            "primary": "#005bbf",
            "secondary-fixed": "#e2e0fc",
            "on-tertiary": "#ffffff"
          },
          fontFamily: {
            "headline": ["Manrope", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "label": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-header {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Suppression of Nav Shell per Task-Focused/Onboarding Rule -->
<main class="max-w-xl mx-auto px-6 pt-12 pb-24 md:pt-20">
<!-- Hero Branding Section -->
<header class="text-center mb-12">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-primary-container text-white mb-6 shadow-[0_8px_32px_rgba(0,91,191,0.2)]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline font-extrabold text-4xl tracking-tight text-on-surface mb-2">Scholify</h1>
<p class="font-body text-on-surface-variant text-lg">Smart Academic Companion</p>
</header>
<!-- Setup Form Container -->
<div class="space-y-8">
<!-- Personal Information Section -->
<section class="bg-surface-container-low p-6 rounded-2xl">
<h2 class="font-headline font-bold text-xl mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">person</span>
          Personal Details
        </h2>
<div class="space-y-5">
<!-- Student Name Input -->
<div class="space-y-2">
<label class="font-label font-medium text-sm text-on-surface-variant ml-1">Student Name</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-xl h-14 px-5 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline-variant text-on-surface shadow-sm" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- University Selector -->
<div class="space-y-2">
<label class="font-label font-medium text-sm text-on-surface-variant ml-1">University</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-none rounded-xl h-14 px-5 appearance-none focus:ring-2 focus:ring-primary/40 transition-all text-on-surface shadow-sm">
<option selected="">UPES</option>
<option>IIT Delhi</option>
<option>BITS Pilani</option>
<option>Delhi University</option>
<option>Other University</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Academic Config Section -->
<section class="bg-surface-container-low p-6 rounded-2xl">
<h2 class="font-headline font-bold text-xl mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">analytics</span>
          Academic Settings
        </h2>
<div class="space-y-5">
<!-- Grading Scheme -->
<div class="space-y-2">
<label class="font-label font-medium text-sm text-on-surface-variant ml-1">Grading Scheme</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-none rounded-xl h-14 px-5 appearance-none focus:ring-2 focus:ring-primary/40 transition-all text-on-surface shadow-sm">
<option selected="">UPES 10-pt scale</option>
<option>Standard 10.0 GPA</option>
<option>Percentage (%)</option>
<option>4.0 Scale (US)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">tune</span>
</div>
</div>
<!-- Timetable Upload (OCR Teaser) -->
<div class="space-y-2">
<label class="font-label font-medium text-sm text-on-surface-variant ml-1">Class Timetable</label>
<div class="relative group cursor-pointer">
<input class="hidden" id="timetable-upload" type="file"/>
<label class="flex flex-col items-center justify-center w-full min-h-[140px] bg-surface-container-lowest border-2 border-dashed border-outline-variant/30 rounded-2xl hover:bg-white hover:border-primary/50 transition-all group-active:scale-[0.98]" for="timetable-upload">
<div class="bg-secondary-container text-on-secondary-container p-3 rounded-full mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl">document_scanner</span>
</div>
<span class="font-label font-semibold text-on-surface">Upload Timetable Image</span>
<span class="font-label text-xs text-on-surface-variant mt-1">Our AI will parse your schedule automatically</span>
</label>
</div>
<!-- OCR Teaser Badge -->
<div class="flex items-center gap-2 mt-3 px-1">
<span class="flex h-2 w-2 rounded-full bg-tertiary"></span>
<p class="text-[11px] font-medium text-tertiary uppercase tracking-wider">AI-Powered Extraction Active</p>
</div>
</div>
</div>
</section>
<!-- Final Action -->
<footer class="pt-4">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg h-16 rounded-2xl shadow-[0_12px_40px_rgba(0,91,191,0.25)] active:scale-[0.97] transition-all flex items-center justify-center gap-3">
          Complete Setup
          <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-on-surface-variant text-sm mt-6 px-8">
          By continuing, you agree to Scholify's <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
        </p>
</footer>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute top-[60%] -right-[10%] w-[50%] h-[50%] bg-secondary-fixed/30 rounded-full blur-[100px]"></div>
</div>
</body></html>
